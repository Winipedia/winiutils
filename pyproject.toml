[project]
name = "winiutils"
version = "4.0.9"
description = "A utility library for Python development"
license = "MIT"
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
    "cryptography>=49.0.0",
    "defusedxml>=0.7.1",
    "keyring>=25.7.0",
    "keyrings-alt>=5.0.2",
    "polars>=1.42.1",
    "pyrig>=17.0.0",
    "pyrig-runtime>=2.0.0",
    "tqdm>=4.68.3",
]
license-files = [
    "LICENSE",
]
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
keywords = [
    "pyrig",
]

[[project.authors]]
name = "Winipedia"

[[project.maintainers]]
name = "Winipedia"

[project.scripts]
winiutils = "pyrig_runtime.rig.cli.main:main"

[project.urls]
Homepage = "https://github.com/Winipedia/winiutils"
Documentation = "https://Winipedia.github.io/winiutils"
Source = "https://github.com/Winipedia/winiutils"
Issues = "https://github.com/Winipedia/winiutils/issues"
Changelog = "https://github.com/Winipedia/winiutils/releases"

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "deptry>=0.25.1",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.6",
    "mkdocs-mermaid2-plugin>=1.2.3",
    "mkdocstrings[python]>=1.0.4",
    "pip-audit>=2.10.1",
    "prek>=0.4.6",
    "pyrig>=17.0.0",
    "pyrig-pypi>=3.0.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.15.20",
    "rumdl>=0.2.28",
    "ty>=0.0.56",
    "types-defusedxml>=0.7.0.20260504",
    "types-tqdm>=4.68.0.20260608",
    "typos>=1.48.0",
]

[build-system]
requires = [
    "uv_build",
]
build-backend = "uv_build"

[tool.ruff.lint]
select = [
    "ALL",
]
ignore = [
    "D203",
    "D213",
    "COM812",
    "ANN401",
]
fixable = [
    "ALL",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",
]

[tool.mypy]
strict = true
warn_unreachable = true
show_error_codes = true
files = "."

[tool.pytest.ini_options]
testpaths = [
    "tests",
]
addopts = "--cov=winiutils --cov-branch --cov-report=term-missing --cov-fail-under=90"

[tool.ty.terminal]
error-on-warning = true

[tool.deptry]
root = "src"

[tool.deptry.per_rule_ignores]
DEP002 = [
    "pyrig-runtime",
]
